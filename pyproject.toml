[project]
name = "lacastv3"
version = "0.1.0"
description = "ANTLR4-backed SQL grammar learning and semantic generation"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "openai>=2",
    "httpx>=0.28",
    "mysql-connector-python>=9.0.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lacastv3*"]
